name: Docker images

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: legendexp/remage

jobs:
  # Docker Hub used to run one build per build rule, i.e. twice for every
  # pushed tag, with the build hook picking the --build-arg values out of
  # $DOCKER_TAG. Here that axis is a matrix instead: on a tag we build both the
  # "stable"- and the "slim"-based image (from the release tarball), on main
  # only the dev one (from this checkout).
  configure:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - name: Assemble build matrix
        id: set
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            version="${{ github.ref_name }}"
            matrix=$(jq -nc --arg v "$version" '{include: [
              {variant: "full", flavor: "stable", version: $v, suffix: ""},
              {variant: "slim", flavor: "slim",   version: $v, suffix: "-slim"}
            ]}')
          else
            matrix=$(jq -nc '{include: [
              {variant: "dev", flavor: "latest", version: "dev", suffix: ""}
            ]}')
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix" | jq .

  build:
    needs: configure
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.configure.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # setuptools-scm needs the full history and the tags to derive the
          # version of the dev image below
          fetch-depth: 0

      - name: Compute image tags and version
        id: cfg
        run: |
          version="${{ matrix.version }}"
          if [[ "${{ matrix.variant }}" == "dev" ]]; then
            tags="${IMAGE}:dev"
            # the dev image is built from this checkout, which is copied into
            # the image without its git history: resolve the version here
            scm_version="$(pipx run setuptools-scm)"
            echo "scm_version=${scm_version}" >> "$GITHUB_OUTPUT"
            echo "building dev image as version ${scm_version}"
          else
            tags="${IMAGE}:${version}${{ matrix.suffix }}"
            # "latest" only ever points at the full flavor, and the tag filter
            # also matches pre-releases (vX.Y.Z-rc1), which must not move it
            if [[ "${{ matrix.variant }}" == "full" && "$version" != *-* ]]; then
              tags="${tags},${IMAGE}:latest"
            fi
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "$tags"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.cfg.outputs.tags }}
          build-args: |
            REMAGE_BASE_FLAVOR=${{ matrix.flavor }}
            REMAGE_VERSION=${{ matrix.version }}
            REMAGE_VERSION_SET=${{ steps.cfg.outputs.scm_version }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
