version: 2

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

formats:
  - epub
  - pdf

build:
  os: ubuntu-24.04
  tools:
    python: miniforge3-25.11
  jobs:
    post_checkout: # for setuptools_scm to work correctly.
      - git fetch --unshallow || true
    pre_build:
      # prepare python docs build
      - pip install .
      - rm -rf docs/api
      - sphinx-apidoc --private --module-first --force --output-dir
        docs/api python/remage/ python/remage/_version.py python/remage/__main__.py
      # prepare Doxyfile (with the Geant4 tag file only if it could be downloaded,
      # the upstream host is flaky), run Doxygen, prepare Sphinx
      # TODO: revert this temporary "fix" for the untrusted certificate (--no-check-certificate)
      - |
        G4TAG_URL=https://geant4.kek.jp/Reference/11.3.0
        TAGFILES=""
        WARN_AS_ERROR=NO
        if wget --quiet --tries=2 --timeout=30 --no-check-certificate -O docs/geant4.tag "$G4TAG_URL/geant4.tag" &&
           echo "79b695ba4d8993c6bb8b93aba40fbc019c91378ab0bd1c20e200f8203cfd2b3c  docs/geant4.tag" | sha256sum --check --status; then
          TAGFILES="\"geant4.tag=$G4TAG_URL\""
          WARN_AS_ERROR=YES
        else
          rm -f docs/geant4.tag
          echo "WARNING: could not obtain Geant4 Doxygen tag file, building docs without links to the Geant4 reference (Doxygen warnings are not errors)"
        fi
        sed "s|@DOXYGEN_INPUT_DIR@|..|g;s|@DOXYGEN_OUTPUT_DIR@|_doxygen|g;s|@DOXYGEN_TAGFILES@|$TAGFILES|g;s|@DOXYGEN_WARN_AS_ERROR@|$WARN_AS_ERROR|g" \
          docs/Doxyfile.in > docs/Doxyfile
      - export DOXYGEN_DOT_PATH=$(which dot)
      - cat docs/Doxyfile
      - cd docs && doxygen
      - mkdir -p docs/extra/doxygen
      - cp -r docs/_doxygen/html/* docs/extra/doxygen
      - cp docs/conf.py.in docs/conf.py
      # this is necessary to preserve versions from git tags. I don't know what writes to this file before building. wtf!!
      - git restore docs/environment.yml

conda:
  environment: docs/environment.yml
